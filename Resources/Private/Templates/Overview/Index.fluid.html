<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:mlang_tabs_tab" /></h1>

    <f:if condition="{records}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.table" /></th>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.title" /></th>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:field.ai_created" /></th>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:field.ai_modified" /></th>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.reviewed" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{records}" as="record">
                        <tr>
                            <td>{record.table}</td>
                            <td>
                                <be:link.editRecord uid="{record.uid}" table="{record.table}">
                                    <f:if condition="{record.title}">
                                        <f:then>{record.title}</f:then>
                                        <f:else>{record.table} #{record.uid}</f:else>
                                    </f:if>
                                </be:link.editRecord>
                            </td>
                            <td>
                                <f:if condition="{record.metadata.aiCreated}">
                                    <core:icon identifier="actions-check" />
                                </f:if>
                            </td>
                            <td>
                                <f:if condition="{record.metadata.aiModified}">
                                    <core:icon identifier="actions-check" />
                                </f:if>
                            </td>
                            <td>
                                <f:if condition="{record.metadata.reviewed}">
                                    <f:then>
                                        <f:format.date format="d.m.Y H:i">@{record.metadata.reviewedDate}</f:format.date>
                                    </f:then>
                                    <f:else>
                                        <span class="badge badge-warning">
                                            <f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_db.xlf:notice.reviewRequired" />
                                        </span>
                                    </f:else>
                                </f:if>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else>
            <f:be.infobox
                title="{f:translate(key: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.empty.title')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
            >
                <f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.empty.message" />
            </f:be.infobox>
        </f:else>
    </f:if>

</f:section>

</html>
