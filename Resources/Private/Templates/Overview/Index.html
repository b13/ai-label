<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:mlang_tabs_tab" /></h1>

    <f:if condition="{paginator.paginatedItems}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.table" /></th>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.title" /></th>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.origin" /></th>
                        <th><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.reviewed" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{paginator.paginatedItems}" as="record">
                        <tr>
                            <td>{record.table}</td>
                            <td>
                                <be:link.editRecord uid="{record.uid}" table="{record.table}">
                                    <f:if condition="{record.title}">
                                        <f:then>{record.title}</f:then>
                                        <f:else>{record.table} #{record.uid}</f:else>
                                    </f:if>
                                </be:link.editRecord>
                            </td>
                            <td>
                                <f:if condition="{record.metadata.aiCreated}">
                                    <f:then><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_db.xlf:field.ai_origin.generated" /></f:then>
                                    <f:else><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_db.xlf:field.ai_origin.manipulated" /></f:else>
                                </f:if>
                            </td>
                            <td>
                                <f:format.raw>{record.reviewBadge}</f:format.raw>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>

            <f:if condition="{pagination.lastPageNumber} > 1">
                <nav aria-label="{f:translate(key: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.pagination')}">
                    <ul class="pagination">
                        <li class="page-item {f:if(condition: '{previousPageUri}', else: 'disabled')}">
                            <f:if condition="{previousPageUri}">
                                <f:then>
                                    <a class="page-link" href="{previousPageUri}"><core:icon identifier="actions-caret-left" /></a>
                                </f:then>
                                <f:else>
                                    <span class="page-link"><core:icon identifier="actions-caret-left" /></span>
                                </f:else>
                            </f:if>
                        </li>
                        <f:for each="{pageUris}" as="pageUri" key="pageNumber">
                            <li class="page-item {f:if(condition: '{pageNumber} == {paginator.currentPageNumber}', then: 'active')}">
                                <a class="page-link" href="{pageUri}">{pageNumber}</a>
                            </li>
                        </f:for>
                        <li class="page-item {f:if(condition: '{nextPageUri}', else: 'disabled')}">
                            <f:if condition="{nextPageUri}">
                                <f:then>
                                    <a class="page-link" href="{nextPageUri}"><core:icon identifier="actions-caret-right" /></a>
                                </f:then>
                                <f:else>
                                    <span class="page-link"><core:icon identifier="actions-caret-right" /></span>
                                </f:else>
                            </f:if>
                        </li>
                    </ul>
                </nav>
            </f:if>
        </f:then>
        <f:else>
            <f:be.infobox
                title="{f:translate(key: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.empty.title')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
            >
                <f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.empty.message" />
            </f:be.infobox>
        </f:else>
    </f:if>

    <div id="b13_loves_typo3">
        <a href="https://b13.com?utm_source=web&utm_medium=dashboard&utm_campaign=ai_label&utm_id=ai_label" target="_blank" rel="external">
            made with ❤ by b13
        </a>
    </div>
</f:section>

</html>
