<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="table-fit">
    <table class="table table-striped table-hover ailabel-overview-table">
        <thead>
        <tr>
            <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'title', labelKey: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.title'}" />
            <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'table', labelKey: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.table'}" />
            <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'author', labelKey: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.author'}" />
            <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'origin', labelKey: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.origin'}" />
            <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'reviewed', labelKey: 'LLL:EXT:ai_label/Resources/Private/Language/locallang_mod.xlf:overview.reviewed'}" />
        </tr>
        </thead>
        <tbody>
        <f:for each="{paginator.paginatedItems}" as="record">
            <tr>
                <td class="nowrap">
                    <button
                        type="button"
                        class="btn btn-link p-0"
                        data-contextmenu-trigger="click"
                        data-contextmenu-table="{record.table}"
                        data-contextmenu-uid="{record.uid}"
                        aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.contextMenu.open')}"
                    >
                        <f:format.raw>{record.icon}</f:format.raw>
                    </button>
                    <be:link.editRecord uid="{record.uid}" table="{record.table}">
                        <f:if condition="{record.title}">
                            <f:then>{record.title}</f:then>
                            <f:else>{record.tableLabel} #{record.uid}</f:else>
                        </f:if>
                    </be:link.editRecord>
                </td>
                <td>{record.tableLabel}</td>
                <td>{record.author}</td>
                <td>
                    <f:if condition="{record.metadata.aiCreated}">
                        <f:then><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_db.xlf:field.ai_origin.generated" /></f:then>
                        <f:else><f:translate key="LLL:EXT:ai_label/Resources/Private/Language/locallang_db.xlf:field.ai_origin.manipulated" /></f:else>
                    </f:if>
                </td>
                <td>
                    <f:format.raw>{record.reviewBadge}</f:format.raw>
                </td>
            </tr>
        </f:for>
        </tbody>
    </table>
</div>

</html>
